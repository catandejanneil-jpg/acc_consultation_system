{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center auth-wrap"><div class="col-md-7 col-lg-5">
  <div class="card"><div class="card-header text-center py-3"><h1 class="h4 mb-0">Sign in</h1></div>
  <div class="card-body p-4">
    <form method="post">{{ m.csrf() }}
      <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" name="email" required autofocus autocomplete="username"></div>
      <div class="mb-4"><label class="form-label" for="password">Password</label><input type="password" class="form-control" id="password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
    <p class="text-center small mt-3 mb-0">New student? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div></div>
</div></div>
{% endblock %}
