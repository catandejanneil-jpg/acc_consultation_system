{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% block title %}System settings{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<h1 class="h3 page-title mb-3">System settings</h1>
<div class="card"><div class="card-body">
<form method="post">{{ m.csrf() }}
  <div class="mb-3"><label class="form-label" for="site_name">System name</label><input class="form-control" id="site_name" name="site_name" value="{{ s.site_name }}" required></div>
  <div class="mb-3"><label class="form-label" for="max_active_per_student">Open consultations allowed per student</label>
    <input type="number" class="form-control" id="max_active_per_student" name="max_active_per_student" min="1" max="20" value="{{ s.max_active_per_student }}" required>
    <div class="form-text">Counts pending and approved consultations.</div></div>
  <div class="form-check form-switch mb-4"><input class="form-check-input" type="checkbox" role="switch" id="allow_registration" name="allow_registration" {{ 'checked' if s.allow_registration == '1' }}>
    <label class="form-check-label" for="allow_registration">Allow students to register themselves</label></div>
  <button class="btn btn-primary">Save settings</button>
</form></div></div>
</div></div>
{% endblock %}
